[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffickit-viz"
version = "0.2.0"
description = "Visualisation and video output layer for TrafficKit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "YU-CHENG KAO" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # 相依方向是單向的：這裡可以依賴 traffickit，反過來永遠不行。
    # 兩個套件都還沒上 PyPI，所以要先安裝 traffickit，pip 才不會去 PyPI
    # 找不到而失敗。安裝方式見 README。
    "traffickit>=0.1",
    # headless 版沒有 cv2 自己的 GUI 相依，而影片的解碼、繪製與編碼都用得到。
    # 視窗與預覽一律由 Qt 負責，不走 cv2.imshow，所以不需要完整版 opencv。
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    # 圖形介面。列為必要相依是刻意的決定：使用者不必記 extras 就有介面。
    # 代價是後端、CI 與批次使用也會裝進 Qt（約 150–200 MB）；只要繪製與
    # 影片輸出的場合仍然完全不 import 它，所以功能上沒有負擔，只有體積。
    "PySide6>=6.6",
]

[project.optional-dependencies]
# 命令列進度條，缺了也還能跑。
extras = [
    "tqdm>=4.66",
]

[project.scripts]
# 用 console script 而不是 gui script：這是給工程人員用的工具，
# 出錯時看得到訊息比少一個主控台視窗重要。
traffickit-viz = "traffickit_viz.gui:main"

[project.urls]
Documentation = "https://yckao5888.github.io/TrafficKit/latest/"
Source = "https://github.com/YCkao5888/TrafficKit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffickit_viz*"]
