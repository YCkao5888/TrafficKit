[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffickit"
version = "0.1.0"
description = "Traffic analysis calculation toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "YU-CHENG KAO" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.6",
    "myst-parser>=2.0",
]

[project.urls]
Documentation = "https://yckao5888.github.io/TrafficKit/latest/"
Source = "https://github.com/YCkao5888/TrafficKit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffickit*"]
