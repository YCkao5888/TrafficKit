[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffickit"
version = "0.1.0"
description = "Traffic analysis calculation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffickit*"]
